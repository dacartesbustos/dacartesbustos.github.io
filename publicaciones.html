<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicaciones | CERS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos adicionales para la vista de lectura */
        #post-detail {
            display: none; /* Oculto por defecto */
            animation: fadeIn 0.5s ease;
        }

        .back-btn {
            background: var(--bg-card);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2rem;
            display: inline-block;
            font-weight: 600;
        }

        .full-post-content {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .full-post-content img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">CERS o no CERS</div>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="publicaciones.html" class="active">Publicaciones</a></li>
            <li><a href="eventos.html">Eventos</a></li>
        </ul>
    </nav>

    <main class="container">
        <div id="view-list">
            <h1 style="margin-bottom: 3rem;">Archivo de Artículos</h1>
            <div id="blogger-feed" class="grid-posts">
                <p>Cargando publicaciones de Blogger...</p>
            </div>
        </div>

        <div id="post-detail">
            <button class="back-btn" onclick="showList()">← Volver a artículos</button>
            <article>
                <span id="detail-tag" class="tag"></span>
                <h1 id="detail-title" style="font-size: 3rem; margin: 1rem 0 2rem 0; color: var(--text-primary);"></h1>
                <div id="detail-content" class="full-post-content"></div>
            </article>
        </div>
    </main>

    <script>
        const BLOG_URL = 'https://cersonocers.blogspot.com'; 
        let allPosts = []; // Guardaremos los posts aquí

        async function loadFeed() {
            const container = document.getElementById('blogger-feed');
            try {
                const response = await fetch(`${BLOG_URL}/feeds/posts/default?alt=json&max-results=10`);
                if (!response.ok) throw new Error('No se pudo obtener el feed');
                
                const data = await response.json();
                allPosts = data.feed.entry; // Guardamos los datos completos
                container.innerHTML = '';

                allPosts.forEach((entry, index) => {
                    const title = entry.title.$t;
                    
                    let imgHtml = '🐳'; 
                    if (entry.media$thumbnail) {
                        imgHtml = `<img src="${entry.media$thumbnail.url.replace('s72-c', 's1600')}" style="width:100%; height:100%; object-fit:cover;">`;
                    }

                    container.innerHTML += `
                        <article class="post-card" onclick="showPost(${index})" style="cursor:pointer;">
                            <div class="post-img">${imgHtml}</div>
                            <div class="post-body">
                                <span class="tag">Blogger</span>
                                <h2 style="font-size:1.2rem; margin:10px 0;">${title}</h2>
                                <span class="btn-read">Leer artículo →</span>
                            </div>
                        </article>
                    `;
                });
            } catch (e) {
                container.innerHTML = `<p style="color:var(--accent)">⚠️ Error al cargar el contenido.</p>`;
            }
        }

        function showPost(index) {
            const post = allPosts[index];
            
            // Llenar la vista de detalle
            document.getElementById('detail-title').innerText = post.title.$t;
            document.getElementById('detail-content').innerHTML = post.content.$t;
            document.getElementById('detail-tag').innerText = post.category ? post.category.term : 'Artículo';

            // Intercambiar vistas
            document.getElementById('view-list').style.display = 'none';
            document.getElementById('post-detail').style.display = 'block';
            
            // Subir al inicio de la página
            window.scrollTo(0, 0);
        }

        function showList() {
            document.getElementById('view-list').style.display = 'block';
            document.getElementById('post-detail').style.display = 'none';
        }

        loadFeed();
    </script>
</body>
</html>
