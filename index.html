<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | CERS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">📖 CERS o no CERS</div>
        <ul>
            <li><a href="index.html" class="active">Inicio</a></li>
            <li><a href="publicaciones.html">Publicaciones</a></li>
            <li><a href="eventos.html">Eventos</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Proyecto web personal</h1>
        <p style="color: var(--text-secondary)">Gestión y desarrollo web.</p>
    </header>

    <main class="container">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2.5rem;">
            <section>
                <h2 style="margin-bottom: 2rem;">✍️ Última Publicación</h2>
                <div id="recent-post">
                    <p>Cargando novedad...</p>
                </div>
            </section>

            <aside>
                <h2 style="margin-bottom: 2rem;">📅 Agenda</h2>
                <div class="calendar-frame">
                    <iframe src="https://calendar.google.com/calendar/embed?src=dacartesbustos%40gmail.com&ctz=America%2FSantiago&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0" 
                            width="100%" height="400" frameborder="0" scrolling="no"></iframe>
                </div>
            </aside>
        </div>
    </main>

    <script>
    // Función que procesará el post más reciente
    function handleRecentPost(data) {
        const container = document.getElementById('recent-post');
        const entries = data.feed.entry;

        if (!entries || entries.length === 0) {
            container.innerHTML = "<p>No hay publicaciones recientes.</p>";
            return;
        }

        const entry = entries; // Tomamos solo el primero
        const title = entry.title.$t;
        const link = entry.link.find(l => l.rel === 'alternate').href;
        
        // Intentar obtener la imagen
        let imgUrl = 'https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=500&auto=format&fit=crop';
        if (entry.media$thumbnail) {
            imgUrl = entry.media$thumbnail.url.replace('/s72-c/', '/s600/');
        }

        container.innerHTML = `
            <article class="post-card">
                <div class="post-img" style="height: 200px;">
                    <img src="${imgUrl}" alt="${title}" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="post-body">
                    <span class="tag">Última entrada</span>
                    <h2 style="font-size:1.4rem; margin:10px 0;">${title}</h2>
                    <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:1rem;">
                        Haz clic abajo para leer la última actualización en el blog.
                    </p>
                    <a href="${link}" target="_blank" class="btn-read">Leer ahora →</a>
                </div>
            </article>`;
    }

    // Llamada segura a Blogger
    const script = document.createElement('script');
    script.src = 'https://cersonocers.blogspot.com/feeds/posts/default?alt=json-in-script&callback=handleRecentPost&max-results=1';
    document.body.appendChild(script);
</script>
</body>
</html>
