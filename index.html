<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | CERS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">📖 CERS o no CERS</div>
        <ul>
            <li><a href="index.html" class="active">Inicio</a></li>
            <li><a href="publicaciones.html">Publicaciones</a></li>
            <li><a href="eventos.html">Eventos</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Proyecto web personal</h1>
        <p style="color: var(--text-secondary)">Gestión y desarrollo web.</p>
    </header>

    <main class="container">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2.5rem;">
            <section>
                <h2 style="margin-bottom: 2rem;">✍️ Última Publicación</h2>
                <div id="recent-post">
                    <p>Cargando novedad...</p>
                </div>
            </section>

            <aside>
                <h2 style="margin-bottom: 2rem;">📅 Agenda</h2>
                <div class="calendar-frame">
                    <iframe src="https://calendar.google.com/calendar/embed?src=dacartesbustos%40gmail.com&ctz=America%2FSantiago&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0" 
                            width="100%" height="400" frameborder="0" scrolling="no"></iframe>
                </div>
            </aside>
        </div>
    </main>

<script>
        const BLOG_URL = 'https://cersonocers.blogspot.com';

function handleBloggerData(data) {
    const container = document.getElementById('blogger-feed');
    const entries = data.feed.entry;

    if (!entries) {
        container.innerHTML = "<p>😱 No se encontraron publicaciones.</p>";
        return;
    }

    container.innerHTML = '';
    entries.forEach(entry => {
        const title = entry.title.$t;
        const link = entry.link.find(l => l.rel === 'alternate').href;
        let imgUrl = 'https://64.media.tumblr.com/e7a1a79a940ec23ef8f186f14d73f76e/37a751c2206ad5e8-b3/s2048x3072/cec84e60c02859f257e427f3f5936458585498fd.jpg';
        
        if (entry.media$thumbnail) {
            imgUrl = entry.media$thumbnail.url.replace('/s72-c/', '/s600/');
        }

        container.innerHTML += `
            <article class="post-card">
                <div class="post-img"><img src="${imgUrl}" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="post-body">
                    <span class="tag">Post</span>
                    <h2 style="font-size:1.2rem; margin:10px 0;">${title}</h2>
                    <a href="${link}" target="_blank" class="btn-read">Leer artículo →</a>
                </div>
            </article>`;
    });
}

// Creamos una petición que Blogger acepta más fácilmente
const script = document.createElement('script');
script.src = `${BLOG_URL}/feeds/posts/default?alt=json-in-script&callback=handleBloggerData&max-results=10`;
document.body.appendChild(script);
</script>
</body>
</html>
