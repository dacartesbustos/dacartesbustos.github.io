<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | CERS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">📖 CERS o no CERS</div>
        <ul>
            <li><a href="index.html" class="active">Inicio</a></li>
            <li><a href="publicaciones.html">Publicaciones</a></li>
            <li><a href="eventos.html">Eventos</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Ingeniería y Pensamiento Digital</h1>
        <p style="color: var(--text-secondary)">Explorando Docker, IA y desarrollo web.</p>
    </header>

    <main class="container">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2.5rem;">
            <section>
                <h2 style="margin-bottom: 2rem;">✍️ Última Publicación</h2>
                <div id="recent-post">
                    <p>Cargando novedad...</p>
                </div>
            </section>

            <aside>
                <h2 style="margin-bottom: 2rem;">📅 Agenda</h2>
                <div class="calendar-frame">
                    <iframe src="https://calendar.google.com/calendar/embed?src=dacartesbustos%40gmail.com&ctz=America%2FSantiago&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0" 
                            width="100%" height="400" frameborder="0" scrolling="no"></iframe>
                </div>
            </aside>
        </div>
    </main>

    <script>
        // Script minificado para el inicio (carga solo 1 post)
        fetch('https://cersonocers.blogspot.com/feeds/posts/default?alt=json&max-results=1')
            .then(res => res.json())
            .then(data => {
                const entry = data.feed.entry;
                document.getElementById('recent-post').innerHTML = `
                    <article class="post-card">
                        <div class="post-body">
                            <span class="tag">Nuevo en el Blog</span>
                            <h2 style="font-size:1.5rem;">${entry.title.$t}</h2>
                            <a href="${entry.link.find(l => l.rel === 'alternate').href}" target="_blank" class="btn-read">Leer ahora →</a>
                        </div>
                    </article>`;
            }).catch(() => { document.getElementById('recent-post').innerHTML = "No se pudieron cargar posts."; });
    </script>
</body>
</html>
